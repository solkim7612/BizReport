spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bizreport?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

logging:
  level:
    com.bizreport.api: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

batch:
  upload:
    rate-dir: "src/test/resources/temp/rate/"
    card-dir: "src/test/resources/temp/card/"

nts:
  api:
    url: "https://api.odcloud.kr/api/nts-businessman/v1/status"
    key: "YOUR_DECODED_SERVICE_KEY"