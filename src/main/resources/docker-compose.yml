version: '3.8'
services:
  # MySQL: 세무 데이터 저장
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bizreport

  # Jaeger: 트래킹 서버
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI 확인용
      - "4317:4317"  # OTLP gRPC 접점